[defaults]
inventory = inventory.yml
remote_user = vagrant
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

# inventory: usa inventory.yml por defecto, así que no hace falta repetir -i.
# remote_user: Vagrant usa el usuario vagrant en las tres máquinas.
# host_key_checking = False: simplifica las primeras conexiones SSH del
# laboratorio; reduce seguridad y NO debe usarse en producción. No desactiva
# la validación TLS del servidor FTP.
# interpreter_python: detecta el intérprete Python sin ruido en la salida.
# retry_files_enabled = False: evita archivos .retry en el repositorio.