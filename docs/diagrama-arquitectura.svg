<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3a5f"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3a5f">Arquitectura del despliegue FTP con Vagrant y Ansible</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#555555">Dominio de practica: raul.test</text>

  <!-- Equipo anfitrion -->
  <rect x="30" y="120" width="240" height="250" rx="12" fill="#eef4fb" stroke="#1f3a5f" stroke-width="2"/>
  <text x="150" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3a5f">Equipo anfitrion</text>
  <line x1="45" y1="160" x2="255" y2="160" stroke="#1f3a5f" stroke-width="1"/>
  <text x="50" y="188" font-size="13" fill="#222222">Vagrant + VirtualBox</text>
  <text x="50" y="218" font-size="13" fill="#222222">WSL: Ansible + community.crypto</text>
  <text x="50" y="248" font-size="13" fill="#222222">Navegador: www.raul.test</text>
  <text x="50" y="278" font-size="13" fill="#222222">Cliente FTP: ftp.raul.test</text>
  <text x="50" y="308" font-size="13" fill="#222222">DNS del SO: 192.168.57.5</text>
  <text x="50" y="340" font-size="12" fill="#666666">Archivos del proyecto en /vagrant</text>

  <!-- Red privada -->
  <rect x="310" y="90" width="620" height="400" rx="12" fill="#f7fbf7" stroke="#2f7d4f" stroke-width="2"/>
  <text x="620" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f7d4f">Red privada VirtualBox 192.168.57.0/24</text>

  <!-- VM dns -->
  <rect x="345" y="150" width="260" height="170" rx="10" fill="#e6f0fa" stroke="#2f5f9e" stroke-width="2"/>
  <text x="475" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5f9e">VM dns</text>
  <text x="475" y="200" text-anchor="middle" font-size="13" fill="#222222">dns.raul.test</text>
  <text x="475" y="220" text-anchor="middle" font-size="13" fill="#222222">192.168.57.5</text>
  <line x1="360" y1="232" x2="590" y2="232" stroke="#2f5f9e" stroke-width="1"/>
  <text x="362" y="252" font-size="12" fill="#222222">BIND 9</text>
  <text x="362" y="272" font-size="12" fill="#222222">Zona directa raul.test</text>
  <text x="362" y="292" font-size="12" fill="#222222">Zona inversa 57.168.192.in-addr.arpa</text>
  <text x="362" y="310" font-size="12" fill="#222222">CNAME www y ftp a negocio</text>

  <!-- VM negocio -->
  <rect x="640" y="150" width="270" height="300" rx="10" fill="#eaf7ee" stroke="#2f7d4f" stroke-width="2"/>
  <text x="775" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f7d4f">VM negocio</text>
  <text x="775" y="200" text-anchor="middle" font-size="13" fill="#222222">negocio.raul.test</text>
  <text x="775" y="220" text-anchor="middle" font-size="13" fill="#222222">192.168.57.7</text>
  <line x1="655" y1="232" x2="895" y2="232" stroke="#2f7d4f" stroke-width="1"/>
  <text x="660" y="254" font-size="12" fill="#222222">Apache 2</text>
  <text x="700" y="254" font-size="12" fill="#555555">/var/www/html</text>
  <text x="660" y="282" font-size="12" fill="#222222">vsftpd con TLS explicito</text>
  <text x="660" y="306" font-size="12" fill="#222222">Usuarios: juan y ana</text>
  <text x="660" y="330" font-size="12" fill="#222222">ana: raiz FTP /var/www/html</text>
  <text x="660" y="354" font-size="12" fill="#222222">juan: chroot en /home/juan</text>
  <text x="660" y="382" font-size="12" fill="#222222">Certificado: ftp.raul.test</text>
  <text x="660" y="410" font-size="12" fill="#222222">Grupo webpublish + setgid 2775</text>

  <!-- Flechas -->
  <line x1="270" y1="170" x2="345" y2="170" stroke="#1f3a5f" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="307" y="162" text-anchor="middle" font-size="11" fill="#1f3a5f">vagrant up</text>

  <line x1="270" y1="218" x2="345" y2="218" stroke="#1f3a5f" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="307" y="210" text-anchor="middle" font-size="11" fill="#1f3a5f">playbooks</text>

  <line x1="270" y1="270" x2="640" y2="290" stroke="#1f3a5f" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#1f3a5f">DNS, HTTP y FTP</text>

  <line x1="605" y1="220" x2="640" y2="220" stroke="#2f7d4f" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="622" y="212" text-anchor="middle" font-size="11" fill="#2f7d4f">CNAME</text>

  <text x="480" y="528" text-anchor="middle" font-size="12" fill="#666666">Vagrant crea las VM; Ansible las configura; BIND resuelve los nombres del dominio</text>
</svg>
